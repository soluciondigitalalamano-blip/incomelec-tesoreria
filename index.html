<script>
  /* Tema: respeta la elección guardada; si no hay, sigue al sistema */
  (function(){
    try{
      var visto = sessionStorage.getItem('incomelec-teso-intro');
      document.documentElement.classList.add('intro-on');
      document.documentElement.dataset.introVisto = visto ? '1' : '';
    }catch(e){ document.documentElement.classList.add('intro-on'); }
    try{
      var t = localStorage.getItem('incomelec-theme');
      if(t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); /* 'auto' o vacío: sigue al equipo */
    }catch(e){}
  })();
</script>
<script>
/* =====================================================================
   DATOS DEL PORTAL — lo único que se edita para actualizar o adaptar
   ---------------------------------------------------------------------
   Fecha de actualización de cada informe (en este orden de prioridad):
   1) La etiqueta que publique el propio dashboard, dentro de su <head>:
        <meta name="lidato:actualizado" content="2026-10-22T09:40-05:00">
        <meta name="lidato:periodo"     content="Semana 43 · 2026">   (opcional)
   2) El campo "actualizado" de abajo (ej. "2026-10-22" o "2026-10-22T09:40").
   3) La fecha de modificación que entregue el servidor (Last-Modified).
   Si no hay ninguna, la tarjeta muestra "Sin fecha". Nunca se inventa.

   "tipo": define el filtro al que pertenece la tarjeta (ver "filtros").
   "entrega": { cada:'habil' } cada día hábil (lun–vie) · { cada:'semana', dia:5 }
   cada viernes · { cada:'mes', dia:31 } fin de mes · { cada:'mes', dia:7 } el 7.
   "cerrado": true marca un mes ya cerrado: no espera más actualizaciones.
   "clase": 'guia' (o 'requerimiento') marca una tarjeta que no es un informe:
   va en verde, al final, y no cuenta en el resumen "x de y informes al día".
   "boton": texto del botón de esa tarjeta (ej. 'Ver guía').
   "entrega": el día fijo de entrega, para calcular la próxima fecha exacta:
        { cada: 'semana', dia: 5 }   → cada viernes (0 dom, 1 lun … 5 vie, 6 sáb)
        { cada: 'mes',    dia: 7 }   → el 7 de cada mes
   "proxima": fecha puntual que reemplaza a la regla una vez (ej. '2026-10-26').
   "margenDias": días de gracia después de la fecha de entrega antes de
   marcarse "Por actualizar".

   ALERTAS (opcional) — un aviso que el cliente ve resaltado en la tarjeta:
   a) Aquí, en el informe que corresponda:
        alerta: { texto: 'Hay 3 requerimientos vencidos', nivel: 'critica', etiqueta: 'Revisar urgente', hasta: '2026-10-31' }
      nivel: 'critica' (rojo) o 'aviso' (naranja). "hasta" es opcional: el
      aviso desaparece solo después de esa fecha. Sin alerta: alerta: null
   b) O publicada por el propio dashboard, dentro de su <head>:
        <meta name="lidato:alerta"       content="Hay 3 requerimientos vencidos">
        <meta name="lidato:alerta-nivel" content="critica">
        <meta name="lidato:alerta-etiqueta" content="Revisar urgente">   (opcional)
      La etiqueta corta reemplaza a "Al día" en la tarjeta; el texto completo

  /* ---------- Alertas ---------- */
  .card.alert-critica{ box-shadow:var(--shadow), 0 0 0 2px var(--danger); }

  .card.alert-aviso.is-hot{ box-shadow:var(--shadow-hi), 0 0 0 2px var(--warn); }
  .card.alert-critica .frame i{ border-color:var(--danger); }

  .alert-msg{
    display:inline-flex; align-items:flex-start; gap:7px;

  .alert-aviso .alert-msg{ background:var(--warn-bg); color:var(--warn); }
  .alert-msg svg{ width:16px; height:16px; flex-shrink:0; margin-top:1px; stroke:currentColor; animation:pulse 1.6s ease-in-out infinite; }
  .tag.alert-critica{ --tag-dot:#F04438; }

  .sum-alert{ display:inline-flex; align-items:center; gap:4px; color:var(--danger); font-weight:600; vertical-align:-2px; }
  .pill.alert-critica{ background:var(--danger); color:var(--on-danger); animation:alertPulse 2s ease-in-out infinite; }
  .pill.alert-aviso{ background:var(--warn-bg); color:var(--warn); }
  @keyframes alertPulse{ 0%,100%{ box-shadow:0 0 0 0 color-mix(in oklch, var(--danger) 45%, transparent); } 50%{ box-shadow:0 0 0 5px color-mix(in oklch, var(--danger) 0%, transparent); } }
  .card.alert-critica h3, .card.alert-aviso h3{ padding-right:150px; }
  .sum-alert.aviso{ color:var(--warn); }
  .sum-alert svg{ width:14px; height:14px; stroke:currentColor; }

  /* ---------- Selector de tema (Automático · Claro · Oscuro) ---------- */
  .theme-seg{ position:relative; padding:4px; gap:2px; }
  .theme-seg button{
    position:relative; z-index:1;

  }
  .theme-seg button svg{ width:18px; height:18px; stroke:currentColor; }

  .theme-seg button:focus-visible{ outline:2.5px solid var(--accent); outline-offset:2px; }
  .seg-ind{
    position:absolute; top:4px; left:4px; width:40px; height:40px; border-radius:999px;
    background:var(--ink);

  /* ---------- Saludo ---------- */
  .today b{ color:var(--ink); font-weight:600; }

  /* ---------- Resumen usable como filtro ---------- */

  /* ---------- Animaciones ---------- */
  /* destello único sobre la franja verde al cargar */

  }
  @keyframes sweep{ from{ transform:translateX(-120%); } to{ transform:translateX(120%); } }
  /* reacomodo de tarjetas al filtrar o buscar */
  ::view-transition-group(*){ animation-duration:.26s; animation-timing-function:cubic-bezier(.2,.8,.2,1); }
  ::view-transition-old(*), ::view-transition-new(*){ animation-duration:.2s; }

  .summary strong [data-count]{ display:inline; margin:0; font:inherit; color:inherit; }

  /* ---------- Filtros de frecuencia ---------- */
  .chips{ display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }

  }
  .chip:hover{ color:var(--ink); transform:translateY(-1px); }

  }
  .chip[aria-pressed="true"]{ background:var(--ink); color:var(--surface); }
  .chip[aria-pressed="true"] b{ background:rgb(255 255 255 / .18); color:inherit; }
  :root[data-theme="dark"] .chip[aria-pressed="true"] b{ background:rgb(0 0 0 / .12); }
  .chip:focus-visible{ outline:2.5px solid var(--accent); outline-offset:2px; }
  @media (min-width:901px) and (max-height:800px){

  /* ---------- Cuadrícula adaptable al filtrar ---------- */
  @media (min-width:901px){

    .grid.is-big .card .desc{ font-size:clamp(14.5px, 1.9vh, 17px); }
    .grid.is-big .pill{ height:32px; font-size:13.5px; }

    .grid.is-big .fresh .k{ font-size:13px; }

    .grid.is-big .fresh .meta{ font-size:14px; }
    .grid.is-big .go{ min-height:clamp(56px, 7.4vh, 68px); font-size:clamp(16px, 2vh, 18px); padding-left:24px; }
    .grid.is-big .go .arrow{ width:clamp(42px, 5.6vh, 52px); height:clamp(42px, 5.6vh, 52px); }
  }

  /* bloque extra: solo visible cuando la tarjeta crece al filtrar */
  .extra{ display:none; }
  @media (min-width:901px){

  /* =========================================================
     CORTINILLA DE ENTRADA
     ========================================================= */
  .intro{ display:none; }
  html.intro-on .intro{
    display:flex; position:fixed; inset:0; z-index:100;
    align-items:center; justify-content:center;
    color:#FFFFFF; overflow:hidden; outline:none;
    clip-path:inset(0 0 0 0);
  }
  html.intro-on body{ overflow:hidden; }
  /* mientras la cortinilla está, las animaciones del portal esperan */
  html.intro-on:not(.intro-out) .card, html.intro-on:not(.intro-out) .brandbar::before{ animation-play-state:paused; }

  .intro-bg{
    position:absolute; inset:0;
    background:
      radial-gradient(60% 70% at 50% 45%, color-mix(in oklch, var(--brand-bright) 70%, white 10%) 0%, transparent 70%),
      linear-gradient(160deg, #0F5A37 0%, #0A3D25 55%, #062817 100%);
  }
  .intro-grid{
    position:absolute; inset:-40px;
    background-image:
      linear-gradient(rgb(255 255 255 / .06) 1px, transparent 1px),
      linear-gradient(90deg, rgb(255 255 255 / .06) 1px, transparent 1px);
    background-size:48px 48px;
    mask-image:radial-gradient(55% 55% at 50% 50%, #000 0%, transparent 80%);
    animation:gridDrift 3.2s linear both;
  }
  @keyframes gridDrift{ from{ transform:translate3d(0, 0, 0) scale(1.06); opacity:0; } 20%{ opacity:1; } to{ transform:translate3d(0, -24px, 0) scale(1); opacity:1; } }
  .intro-scan{
    position:absolute; left:0; right:0; height:140px; top:-140px;
    background:linear-gradient(180deg, transparent 0%, rgb(255 255 255 / .05) 70%, rgb(143 240 190 / .35) 98.5%, transparent 100%);
    animation:scan 1.5s cubic-bezier(.4,0,.2,1) .15s both;
  }
  @keyframes scan{ to{ transform:translateY(calc(100vh + 140px)); } }

  .intro-core{ position:relative; display:flex; flex-direction:column; align-items:center; text-align:center; padding:0 24px; }

  .intro-plate{
    position:relative;
    width:min(84vw, 540px); aspect-ratio:540 / 140;
    display:flex; align-items:center; justify-content:center;
    filter:drop-shadow(0 24px 40px rgb(0 0 0 / .35));
  }
  .intro-plate::before{
    content:""; position:absolute; inset:0; border-radius:18px; background:#FFFFFF;
    border:4px solid #146C43; box-sizing:border-box;
    opacity:0; transform:scale(.96);
    animation:plateFill .45s cubic-bezier(.2,.8,.2,1) .75s both;
  }
  @keyframes plateFill{ to{ opacity:1; transform:scale(1); } }
  .intro-frame{ position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
  .intro-frame rect{
    fill:none; stroke:#FFFFFF; stroke-width:4; vector-effect:non-scaling-stroke;
    stroke-dasharray:100; stroke-dashoffset:100;
    animation:drawFrame .8s cubic-bezier(.65,0,.35,1) .1s both;
  }
  .intro-frame{ animation:frameOut .25s ease 1s both; }
  @keyframes frameOut{ to{ opacity:0; } }
  @keyframes drawFrame{ to{ stroke-dashoffset:0; } }
  .intro-name{
    position:relative;
    font-family:'Poppins', sans-serif; font-style:italic; font-weight:700;
    font-size:clamp(34px, 9.4vw, 70px); letter-spacing:.01em; line-height:1;
    color:#146C43;
    clip-path:inset(0 100% 0 0);
    filter:blur(6px);
    animation:nameIn .6s cubic-bezier(.2,.8,.2,1) .95s both;
  }
  @keyframes nameIn{ to{ clip-path:inset(0 0 0 0); filter:blur(0); } }

  .intro-rule{ width:min(64vw, 340px); height:2px; margin:30px 0 18px; background:rgb(255 255 255 / .15); border-radius:2px; overflow:hidden; }
  .intro-rule i{ display:block; height:100%; background:linear-gradient(90deg, transparent, #8FF0BE, #FFFFFF); transform:scaleX(0); transform-origin:left; animation:rule .55s cubic-bezier(.2,.8,.2,1) 1.35s both; }
  @keyframes rule{ to{ transform:scaleX(1); } }

  .intro-area{
    margin:0;
    font-family:'Inter', system-ui, sans-serif;

    text-transform:uppercase; letter-spacing:.32em;

  }
  .intro-area .ch{
    display:inline-block; opacity:0; transform:translateY(10px); filter:blur(4px);

  }
  .intro-welcome{
    margin:0 0 10px;
    font-family:'Inter', system-ui, sans-serif;
    font-size:clamp(22px, 5vw, 34px); font-weight:600; letter-spacing:-.01em;

  .intro-tag{
    margin:14px 0 0; font-size:13px; font-weight:500; letter-spacing:.08em;

  .intro-progress i{ display:block; height:100%; background:#8FF0BE; transform:scaleX(0); transform-origin:left; animation:prog var(--intro-dur, 2.7s) linear both; }
  @keyframes prog{ to{ transform:scaleX(1); } }

  .intro-skip:focus-visible{ outline:2.5px solid #FFFFFF; outline-offset:3px; }

  /* salida: la cortinilla se levanta y deja ver el portal */
  html.intro-out .intro{
    pointer-events:none;
    clip-path:inset(0 0 100% 0);
    transition:clip-path .7s cubic-bezier(.76,0,.24,1);

  @keyframes portalIn{ from{ transform:translateY(24px) scale(.985); opacity:.4; } to{ transform:none; opacity:1; } }

  @media (prefers-reduced-motion: reduce){
    html.intro-on .intro *{ animation-duration:.01ms !important; animation-delay:0s !important; }
    html.intro-out .intro{ transition:opacity .2s linear; clip-path:none; opacity:0; }

  /* ---------- Chulito en relieve cuando todos los informes están al día ---------- */
  .summary .ring{ overflow:visible; }
  .ok-badge{

  @media (prefers-reduced-motion: reduce){
    .ok-badge, .ok-check{ transition:none !important; }
  }

  /* ---------- Tarjeta de requerimientos (no es un informe): verde de marca ---------- */
  .card.is-req{
    background:
      radial-gradient(120% 140% at 100% 0%, color-mix(in oklch, var(--brand-bright) 80%, white) 0%, transparent 55%),

  .card.is-req .fresh{ background:rgb(255 255 255 / .12); }
  .card.is-req .fresh .k, .card.is-req .fresh .meta{ color:rgb(255 255 255 / .82); }
  .card.is-req .fresh time.r{ color:#FFFFFF; }
  .card.is-req .extra div{ border-color:rgb(255 255 255 / .35); }

  .card.is-req .extra b{ color:#FFFFFF; }
  .card.is-req .pill.ok, .card.is-req .pill.none{ background:#FFFFFF; color:#0B4A2E; }
  .card.is-req .pill.warn{ background:#FFF0D4; color:#8A4A00; }
  .card.is-req .go{ background:#FFFFFF; color:#0B4A2E; }
  .card.is-req .go .arrow{ background:#0B4A2E; color:#FFFFFF; }
  .card.is-req.is-hot .go, .card.is-req:focus-visible .go{ background:#FFFFFF; color:#0B4A2E; }
  .card.is-req.is-hot .go .arrow, .card.is-req:focus-visible .go .arrow{ background:#0B4A2E; color:#FFFFFF; }
  .card.is-req .sk{ background:rgb(255 255 255 / .25); }
  .summary [hidden]{ display:none !important; }
  @media (min-width:901px){ .grid.is-big .fresh.is-next{ display:none; } .grid.is-big .card-bottom:has(.fresh.is-next) .go{ flex:1; } }
  /* requerimientos no es recurrente: sin etiqueta flotante al pasar el cursor */
  .card.is-req .tag{ display:none; }

  /* =========================================================
     SELECCIÓN AL PASAR EL CURSOR: borde verde + profundidad 3D suave
     (reemplaza las esquinas verdes)
     ========================================================= */
  .frame{ display:none !important; }
  .card{
    --sel:var(--accent);
    --sel-deep:color-mix(in oklch, var(--accent) 65%, black);
    transition:transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s cubic-bezier(.2,.8,.2,1), background-color .3s ease;
  }
  .card.is-hot, .card:focus-visible,
  .card.alert-critica.is-hot, .card.alert-aviso.is-hot{
    transform:translateY(-6px);
    box-shadow:
      0 0 0 2px var(--sel),                                                  /* borde verde */
      0 5px 0 -1px color-mix(in oklch, var(--sel-deep) 55%, transparent),    /* canto inferior suave: volumen */
      0 18px 32px -12px color-mix(in oklch, var(--sel) 45%, transparent),    /* sombra proyectada con tinte verde */
      0 36px 60px -28px rgb(0 0 0 / .18);                                    /* sombra de ambiente */
  }
  /* luz superior muy sutil, como si la tarjeta recibiera luz desde arriba */
  .card::after{
    content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    background:linear-gradient(180deg, rgb(255 255 255 / .55) 0%, rgb(255 255 255 / 0) 22%);
    opacity:0; transition:opacity .35s ease;
  }
  .card.is-hot::after, .card:focus-visible::after{ opacity:1; }
  :root[data-theme="dark"] .card::after{ background:linear-gradient(180deg, rgb(255 255 255 / .06) 0%, transparent 22%); }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .card::after{ background:linear-gradient(180deg, rgb(255 255 255 / .06) 0%, transparent 22%); } }
  .card.is-req::after{ background:linear-gradient(180deg, rgb(255 255 255 / .14) 0%, transparent 25%); }
  .card.is-press{ transform:translateY(-2px) scale(.992); box-shadow:0 0 0 2px var(--sel), 0 2px 0 -1px color-mix(in oklch, var(--sel-deep) 55%, transparent), 0 8px 16px -10px rgb(0 0 0 / .2); }
  /* tarjetas con alerta: el borde de selección conserva su color de alerta */
  .card.alert-critica{ --sel:var(--danger); --sel-deep:color-mix(in oklch, var(--danger) 65%, black); }
  .card.alert-aviso{ --sel:var(--warn); --sel-deep:color-mix(in oklch, var(--warn) 65%, black); }
  /* tarjeta verde de requerimientos: borde verde claro para que se note sobre el verde */
  .card.is-req{ --sel:#8FF0BE; --sel-deep:#0A3D25; }
  @media (prefers-reduced-motion: reduce){
    .card.is-hot, .card:focus-visible{ transform:none; }
  }
  @media (max-width:768px){
    .card.is-hot, .card:focus-visible{ transform:none !important; }
  }
  /* etiqueta flotante: negro sólido y texto blanco, siempre por encima del brillo de la tarjeta */
  .card .tag{
    z-index:5;
    background:#111111 !important; color:#FFFFFF !important;
    box-shadow:0 4px 12px -4px rgb(0 0 0 / .35);
  }
  .card::after{ z-index:0; }
  :root[data-theme="dark"] .card .tag{ box-shadow:0 0 0 1px rgb(255 255 255 / .14), 0 4px 12px -4px rgb(0 0 0 / .6); }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .card .tag{ box-shadow:0 0 0 1px rgb(255 255 255 / .14), 0 4px 12px -4px rgb(0 0 0 / .6); } }
  @media (min-width:901px){
    .grid[data-n="4"] .card-bottom{ flex-direction:column; align-items:stretch; }
    .grid[data-n="4"] .card-bottom .go{ align-self:stretch; }
    .grid[data-n="4"] .extra{ grid-template-columns:1fr; }
  }
  @media (min-width:901px) and (max-width:1180px){ .grid[data-n="4"]{ grid-template-columns:repeat(2, minmax(0, 1fr)); } }

<script>
/* ---------- Cortinilla de entrada ---------- */
window.INTRO_LISTA = (function(){
  var root = document.documentElement;
  var intro = document.getElementById('intro');
  var cfg = (window.PORTAL && window.PORTAL.cortinilla) || 'siempre';
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var listo, prom = new Promise(function(r){ listo = r; });
  var mostrar = cfg === 'siempre' || (cfg === 'sesion' && !root.dataset.introVisto);
  if(!mostrar){ root.classList.remove('intro-on'); listo(); return prom; }

  /* texto del área, letra por letra */
  var area = document.getElementById('intro-area');
  var txt = (window.PORTAL && window.PORTAL.area) || '';
  area.setAttribute('aria-label', txt);
  area.innerHTML = txt.split('').map(function(ch, i){
    return ch === ' ' ? '<span class="sp" aria-hidden="true"></span>' : '<span class="ch" aria-hidden="true" style="--c:' + i + '">' + ch + '</span>';
  }).join('');

  var DUR = reduce ? 900 : 2950;
  intro.style.setProperty('--intro-dur', DUR + 'ms');
  try{ sessionStorage.setItem('incomelec-teso-intro', '1'); }catch(e){}
  var cerrado = false, t;
  function cerrar(){
    if(cerrado) return; cerrado = true;
    clearTimeout(t);
    root.classList.add('intro-out');
    intro.setAttribute('aria-hidden', 'true');
    listo();
    setTimeout(function(){ intro.remove(); root.classList.remove('intro-on', 'intro-out'); }, reduce ? 250 : 900);
  }
  t = setTimeout(cerrar, DUR);
  document.getElementById('intro-skip').addEventListener('click', cerrar);
  intro.addEventListener('click', cerrar);
  document.addEventListener('keydown', function k(e){
    if(cerrado){ document.removeEventListener('keydown', k); return; }
    if(e.key === 'Escape' || e.key === 'Enter' || e.key === ' '){ e.preventDefault(); cerrar(); }
  });
  intro.focus({ preventScroll:true });
  return prom;
})();

(function(){
  var DATA = window.PORTAL;
  var TZ = DATA.zonaHoraria;
  var root = document.documentElement;
  var grid = document.getElementById('reports');
  var empty = document.getElementById('empty');
  var q = document.getElementById('q');
  var status = document.getElementById('result-status');
  var themeBtn = document.getElementById('theme');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  var fine = window.matchMedia('(hover: hover) and (pointer: fine) and (min-width: 769px)');

  /* ---------- Iconos (Lucide, en línea) ---------- */
  var ICONS = {
    wallet:'<path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/>',
    file:'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M16 13H8M16 17H8M10 9H8"/>',
    receipt:'<path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8M12 17.5v-11"/>',
    check:'<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
    clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
    help:'<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3M12 17h.01"/>',
    tasks:'<rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/>',
    inbox:'<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
    target:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
    alert:'<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4M12 17h.01"/>',
    gauge:'<path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/>',
    calendar:'<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
    book:'<path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>',
    lock:'<rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
    arrow:'<path d="M7 17 17 7M7 7h10v10"/>'
  };
  function svg(name){ return '<svg class="lc" viewBox="0 0 24 24" aria-hidden="true">' + ICONS[name] + '</svg>'; }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  /* ---------- Fechas ---------- */
  var fmtParts = new Intl.DateTimeFormat('es-CO', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit', hourCycle:'h23', timeZone:TZ });
  function absoluta(f){
    var o = {}; fmtParts.formatToParts(f.d).forEach(function(x){ o[x.type] = x.value; });
    var fecha = o.day + ' ' + o.month.replace('.', '') + ' ' + o.year;
    return f.sinHora ? fecha : fecha + ' · ' + o.hour + ':' + o.minute;
  }
  function capital(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
  var fmtLargo = new Intl.DateTimeFormat('es-CO', { weekday:'long', day:'numeric', month:'long', year:'numeric', timeZone:TZ });
  var rtf = new Intl.RelativeTimeFormat('es', { numeric:'auto' });

  function parseFecha(s){
    if(!s) return null;
    var sinHora = /^\d{4}-\d{2}-\d{2}$/.test(s);
    var d = new Date(sinHora ? s + 'T12:00:00-05:00' : s);
    return isNaN(d) ? null : { d:d, sinHora:sinHora };
  }
  function relativo(d){
    var diff = (d.getTime() - Date.now()) / 1000;
    var a = Math.abs(diff);
    var s = diff < 0 ? -1 : 1;
    if(a < 60) return 'hace un momento';
    if(a < 3600) return rtf.format(s * Math.floor(a/60), 'minute');
    if(a < 86400) return rtf.format(s * Math.floor(a/3600), 'hour');
    if(a < 86400*14) return rtf.format(Math.round(diff/86400), 'day');
    if(a < 86400*60) return rtf.format(Math.round(diff/(86400*7)), 'week');
    return rtf.format(Math.round(diff/(86400*30)), 'month');
  }

  var fmtHora = new Intl.DateTimeFormat('es-CO', { hour:'numeric', hourCycle:'h23', timeZone:TZ });
  var fmtCorta = new Intl.DateTimeFormat('es-CO', { day:'numeric', month:'short', timeZone:TZ });
  function saludo(){
    var h = parseInt(fmtHora.format(new Date()), 10);
    return h < 12 ? 'Buenos días' : h < 19 ? 'Buenas tardes' : 'Buenas noches';
  }
  function pintarHoy(){
    document.getElementById('today').innerHTML = '<b>' + saludo() + '</b> · ' + esc(capital(fmtLargo.format(new Date())));
  }
  function fechaCorta(d){ return fmtCorta.format(d).replace('.', ''); }
  pintarHoy();

  /* ---------- Última visita (para marcar "Nuevo") ---------- */
  var visitaPrevia = null;
  try{
    var v = localStorage.getItem('incomelec-teso-ultima-visita');
    if(v) visitaPrevia = new Date(v);
    localStorage.setItem('incomelec-teso-ultima-visita', new Date().toISOString());
  }catch(e){}

  /* ---------- Render inicial (con esqueletos) ---------- */
  var filtro = null; // 'alerta' | 'warn' | 'none'
  var yaConto = false, anilloListo = true;
  var estado = {}; // id -> { fecha:{d,sinHora}|null, periodo, fuente }
  DATA.informes.forEach(function(inf, i){
    var a = document.createElement('a');
    a.className = 'card' + (inf.clase ? ' is-req' : '');
    a.href = inf.url;
    a.id = 'card-' + inf.id;
    a.style.viewTransitionName = 'card-' + inf.id;
    a.style.setProperty('--i', i);
    a.dataset.search = (inf.nombre + ' ' + inf.descripcion + ' ' + inf.id);
    a.innerHTML =
      '<span class="frame" aria-hidden="true"><i></i><i></i><i></i><i></i></span>' +
      '<span class="tag" aria-hidden="true" data-tag>Comprobando actualización…</span>' +
      '<span class="shine" aria-hidden="true"></span>' +
      '<div class="card-top"><span class="ico">' + svg(inf.icono) + '</span>' +
        '<div class="info"><h3>' + esc(inf.nombre) + '</h3>' +
        '<p class="desc">' + esc(inf.descripcion) + '</p></div>' +
        '<span class="pills" data-pills><span class="sk" style="width:84px;height:28px;border-radius:999px"></span></span></div>' +
      '<div class="extra" data-extra aria-hidden="true"></div>' +
      '<div class="card-bottom">' +
        '<div class="fresh" data-fresh>' +
          '<span class="k">Actualizado</span>' +
          '<span class="v"><span class="sk" style="width:110px"></span></span>' +
        '</div>' +
        '<span class="go">' + esc(inf.boton || (inf.clase === 'requerimiento' ? 'Ver requerimientos' : 'Abrir informe')) + ' <span class="arrow">' + svg('arrow') + '</span></span>' +
      '</div>';
    grid.insertBefore(a, empty);
    bindTilt(a);
  });

  /* ---------- Lectura de la fecha real de cada informe ---------- */
  function leer(inf){
    var manual = { fecha: parseFecha(inf.actualizado), periodo: inf.periodo || null, fuente: inf.actualizado ? 'manual' : null };
    if(location.protocol === 'file:' || !window.fetch) return Promise.resolve(manual);
    var ctrl = window.AbortController ? new AbortController() : null;
    var t = setTimeout(function(){ if(ctrl) ctrl.abort(); }, 5000);
    return fetch(inf.url, { cache:'no-store', signal: ctrl ? ctrl.signal : undefined })
      .then(function(res){
        if(!res.ok) throw new Error(res.status);
        var lm = res.headers.get('Last-Modified');
        return res.text().then(function(html){
          clearTimeout(t);
          var doc = new DOMParser().parseFromString(html, 'text/html');
          var m = doc.querySelector('meta[name="lidato:actualizado"]');
          var p = doc.querySelector('meta[name="lidato:periodo"]');
          var periodo = (p && p.content) || manual.periodo;
          var al = doc.querySelector('meta[name="lidato:alerta"]');
          var aln = doc.querySelector('meta[name="lidato:alerta-nivel"]');
          var ale = doc.querySelector('meta[name="lidato:alerta-etiqueta"]');
          var alerta = (al && al.content.trim()) ? { texto: al.content.trim(), nivel: (aln && aln.content.trim()) || 'critica', etiqueta: (ale && ale.content.trim()) || null } : null;
          var r;
          if(m && parseFecha(m.content)) r = { fecha: parseFecha(m.content), periodo: periodo, fuente:'informe' };
          else if(manual.fecha) r = { fecha: manual.fecha, periodo: periodo, fuente:'manual' };
          else if(lm && parseFecha(lm)) r = { fecha: parseFecha(lm), periodo: periodo, fuente:'servidor' };
          else r = { fecha:null, periodo: periodo, fuente:null };
          r.alerta = alerta;
          var pr = doc.querySelector('meta[name="lidato:por-revisar"]');
          if(pr && pr.content.trim() !== '' && !isNaN(+pr.content)) r.porRevisar = +pr.content;
          return r;
        });
      })
      .catch(function(){ clearTimeout(t); return manual; });
  }

  function alertaVigente(a){
    if(!a || !a.texto) return null;
    if(a.hasta){
      var h = parseFecha(a.hasta);
      if(h && Date.now() > h.d.getTime() + (h.sinHora ? 12 * 3600000 : 0)) return null;
    }
    return a;
  }

  /* ---------- Calendario de entregas (hora de Bogotá) ---------- */
  var fmtYMD = new Intl.DateTimeFormat('en-CA', { year:'numeric', month:'2-digit', day:'2-digit', timeZone:TZ });
  function diaBogota(d){ var p = fmtYMD.format(d).split('-'); return { y:+p[0], m:+p[1], d:+p[2] }; }
  function mediodia(y, m, d){ return new Date(Date.UTC(y, m - 1, d, 17)); } /* 12:00 en Bogotá */
  function finDelDia(f){ return f.getTime() + 12 * 3600000 - 1; }
  /* primera fecha de entrega estrictamente posterior al día "desde" */
  function siguienteEntrega(regla, desde){
    var b = diaBogota(desde), base = mediodia(b.y, b.m, b.d);
    if(regla.cada === 'habil'){
      var t = base.getTime();
      do{ t += 86400000; }while([0, 6].indexOf(new Date(t).getUTCDay()) > -1);
      return new Date(t);
    }
    if(regla.cada === 'semana'){
      var dow = base.getUTCDay(), salto = (regla.dia - dow + 7) % 7 || 7;
      return new Date(base.getTime() + salto * 86400000);
    }
    var y = b.y, m = b.m;
    for(var i = 0; i < 3; i++){
      var ult = new Date(Date.UTC(y, m, 0)).getUTCDate();
      var cand = mediodia(y, m, Math.min(regla.dia, ult));
      if(cand.getTime() > base.getTime()) return cand;
      m++; if(m > 12){ m = 1; y++; }
    }
    return null;
  }
  function proximaEntrega(inf, st){
    var ultima = st && st.fecha ? st.fecha.d : null;
    var especial = inf.proxima ? parseFecha(inf.proxima) : null;
    if(especial && (!ultima || especial.d.getTime() > finDelDia(ultima))) return especial.d;
    if(!inf.entrega) return null;
    return siguienteEntrega(inf.entrega, ultima || new Date(Date.now() - 86400000));
  }
  /* próxima fecha de actualización en el calendario (hoy o después), para mostrar al usuario */
  function proximaVisible(inf, st){
    var hoy = new Date(Date.now() - 86400000);
    /* si ya se actualizó hoy (o después), la próxima es la siguiente a esa actualización */
    if(st && st.fecha && st.fecha.d.getTime() > hoy.getTime()) hoy = st.fecha.d;
    var especial = inf.proxima ? parseFecha(inf.proxima) : null;
    if(especial && finDelDia(especial.d) >= Date.now()) return especial.d;
    return inf.entrega ? siguienteEntrega(inf.entrega, hoy) : null;
  }
  var fmtDiaSem = new Intl.DateTimeFormat('es-CO', { weekday:'short', day:'numeric', month:'short', timeZone:TZ });
  function fechaEntrega(d){ return fmtDiaSem.format(d).replace(/\./g, '').replace(',', ''); }

  function clasificar(inf, st){
    if(inf.cerrado) return 'cerrado';
    if(inf.tipo === 'demanda' && !inf.entrega) return 'demanda';
    var prox = proximaEntrega(inf, st);
    if(!st || !st.fecha){
      /* sin fecha registrada pero con entrega programada que aún no vence: no hay nada pendiente */
      return prox && Date.now() <= finDelDia(prox) + (inf.margenDias || 0) * 86400000 ? 'ok' : 'none';
    }
    if(!prox) return 'ok';
    return Date.now() <= finDelDia(prox) + (inf.margenDias || 0) * 86400000 ? 'ok' : 'warn';
  }

  function pintar(){
    var ok = 0, warn = 0, none = 0, ultima = null, alertas = 0, avisos = 0;
    DATA.informes.forEach(function(inf){
      var st = estado[inf.id];
      if(!st) return;
      var card = document.getElementById('card-' + inf.id);
      var cls = clasificar(inf, st);
      var pills = card.querySelector('[data-pills]');
      var fresh = card.querySelector('[data-fresh]');
      var esNuevo = st.fecha && visitaPrevia && st.fecha.d > visitaPrevia;

      var pill = cls === 'ok' ? '<span class="pill ok">' + svg('check') + 'Al día</span>'
               : cls === 'warn' ? '<span class="pill warn">' + svg('clock') + 'Por actualizar</span>'
               : cls === 'demanda' ? '<span class="pill none">' + svg('inbox') + 'Según necesidad</span>'
               : cls === 'cerrado' ? '<span class="pill ok">' + svg('lock') + 'Mes cerrado</span>'
               : '<span class="pill none">' + svg('help') + 'Sin fecha</span>';
      var tag = card.querySelector('[data-tag]');
      tag.className = 'tag ' + cls;
      var prox = proximaEntrega(inf, st);
      var extra = card.querySelector('[data-extra]');
      var frecTxt = capital(inf.frecuencia.replace(/^Se (actualiza|entrega) /, ''));
      var sig = proximaVisible(inf, st);
      var proxVal = inf.cerrado ? 'Ninguna · mes cerrado'
                  : inf.tipo === 'demanda' && !inf.entrega ? 'Cuando se necesite'
                  : sig ? fechaEntrega(sig) : 'Sin dato';
      extra.innerHTML =
        '<div><span>Frecuencia</span><b>' + esc(frecTxt) + '</b></div>' +
        '<div><span>Próxima actualización</span><b>' + esc(proxVal) + '</b></div>';
      /* la etiqueta negra muestra solo la próxima actualización */
      tag.textContent = inf.cerrado ? 'Mes cerrado · versión final'
                      : sig ? 'Próxima actualización: ' + fechaEntrega(sig)
                      : cls === 'demanda' ? 'Se actualiza cuando se necesita'
                      : 'Próxima actualización: sin dato';
      pills.innerHTML = (esNuevo ? '<span class="pill new">Nuevo</span>' : '') + pill;

      /* alerta: la de este archivo manda; si no hay, la que publique el dashboard */
      var alerta = alertaVigente(inf.alerta) || alertaVigente(st.alerta);
      /* la alerta ocupa el mismo lugar de la etiqueta de estado: no agrega líneas ni cambia la tarjeta */
      card.classList.remove('alert-critica', 'alert-aviso');
      card.dataset.estado = inf.clase ? 'req-' + cls : cls;
      card.dataset.tipo = inf.tipo || '';
      card.dataset.alerta = alerta ? '1' : '';
      if(alerta){
        var nivel = alerta.nivel === 'aviso' ? 'aviso' : 'critica';
        var etiqueta = alerta.etiqueta || (nivel === 'critica' ? 'Revisar urgente' : 'Revisar');
        card.classList.add('alert-' + nivel);
        pills.innerHTML = (esNuevo ? '<span class="pill new">Nuevo</span>' : '') +
          '<span class="pill alert-' + nivel + '" title="' + esc(alerta.texto) + '">' + svg('alert') + esc(etiqueta) + '</span>';
        tag.className = 'tag alert-' + nivel;
        tag.textContent = (nivel === 'critica' ? 'Alerta: ' : 'Aviso: ') + alerta.texto;
        if(nivel === 'critica') alertas++; else avisos++;
      }

      var vTxt, rHtml, aria;
      if(st.fecha){
        var abs = absoluta(st.fecha);
        vTxt = abs.split(' · ')[0];
        rHtml = '<time class="r" datetime="' + st.fecha.d.toISOString() + '" title="' + esc(abs) + ' (hora de Bogotá)">' + esc(relativo(st.fecha.d)) + '</time>';
        aria = (cls === 'ok' ? 'Al día' : cls === 'cerrado' ? 'Mes cerrado' : cls === 'demanda' ? 'Se actualiza según necesidad' : 'Por actualizar') + ', actualizado el ' + abs + ', ' + relativo(st.fecha.d);
        if(!ultima || st.fecha.d > ultima) ultima = st.fecha.d;
      } else if(cls === 'ok' && sig){
        vTxt = fechaEntrega(sig);
        rHtml = '';
        aria = 'Al día, próxima entrega el ' + vTxt;
      } else {
        vTxt = 'Sin dato';
        rHtml = '';
        aria = 'Sin fecha de actualización';
      }
      var kTxt = (!st.fecha && cls === 'ok' && sig) ? 'Próxima actualización' : 'Actualizado';
      fresh.classList.toggle('is-next', kTxt !== 'Actualizado');
      fresh.innerHTML =
        '<span class="k">' + kTxt + (rHtml ? ' · ' + rHtml : '') + (st.periodo ? ' · ' + esc(st.periodo) : '') + '</span>' +
        '<span class="v">' + esc(vTxt) + '</span>' +
        '<span class="meta"><span class="mf">' + esc(capital(inf.frecuencia.replace(/^Se (actualiza|entrega) /, ''))) + '</span></span>';
      if(inf.clase === 'requerimiento'){
        /* no es periódico: en vez de fechas muestra cuántos requerimientos hay por revisar */
        var n = (st.porRevisar != null) ? st.porRevisar : inf.porRevisar;
        var nTxt = n == null ? 'Sin dato' : n === 0 ? 'Ninguno por revisar' : n + (n === 1 ? ' requerimiento' : ' requerimientos') + ' por revisar';
        if(!alerta){
          pills.innerHTML = n > 0 ? '<span class="pill warn">' + svg('inbox') + 'Por revisar</span>'
                         : n === 0 ? '<span class="pill ok">' + svg('check') + 'Sin pendientes</span>' : '';
        }
        fresh.classList.remove('is-next');
        fresh.innerHTML = '<span class="k">Requerimientos</span><span class="v">' + esc(nTxt) + '</span>';
        extra.innerHTML = '<div style="grid-column:1 / -1"><span>Frecuencia</span><b>Cuando hay requerimientos</b></div>';
        aria = nTxt;
      } else if(inf.clase === 'guia'){
        /* documento de referencia: sin estado de actualización ni fecha esperada */
        if(!alerta) pills.innerHTML = '<span class="pill ok">' + svg('book') + 'Guía</span>';
        fresh.classList.remove('is-next');
        fresh.innerHTML = '<span class="k">Actualizada' + (rHtml ? ' · ' + rHtml : '') + '</span><span class="v">' + esc(st.fecha ? absoluta(st.fecha).split(' · ')[0] : 'Sin dato') + '</span>' +
                          '<span class="meta"><span class="mf">Documento de referencia</span></span>';
        extra.innerHTML = '<div style="grid-column:1 / -1"><span>Para qué sirve</span><b>Consultar cómo leer cada indicador</b></div>';
        aria = 'Documento de referencia';
      }
      card.setAttribute('aria-label', (inf.clase ? (inf.boton || 'Ver') + ': ' : 'Abrir informe ') + inf.nombre + '. ' + (alerta ? (alerta.nivel === 'aviso' ? 'Aviso: ' : 'Alerta: ') + alerta.texto + '. ' : '') + inf.descripcion + ' ' + aria + '.' + (esNuevo ? ' Nuevo desde tu última visita.' : ''));

      if(!inf.clase){ if(cls === 'ok' || cls === 'cerrado') ok++; else if(cls === 'warn') warn++; else if(cls === 'none') none++; }
    });

    /* solo cuentan los informes: los requerimientos y los 'según necesidad' sin fecha quedan fuera */
    var total = DATA.informes.filter(function(i){ return !i.clase && (i.tipo !== 'demanda' || i.entrega); }).length || 1;
    var main = document.getElementById('sum-main');
    var sub = document.getElementById('sum-sub');
    function boton(f, html, extra){
      return '<button type="button" class="sum-f' + (extra || '') + '" data-f="' + f + '" aria-pressed="' + (filtro === f) + '" title="Mostrar solo estos informes">' + html + '</button>';
    }
    var partes = [];
    if(alertas || avisos){
      var txt = [];
      if(alertas) txt.push(alertas + (alertas === 1 ? ' alerta activa' : ' alertas activas'));
      if(avisos) txt.push(avisos + (avisos === 1 ? ' aviso' : ' avisos'));
      partes.push(boton('alerta', svg('alert') + esc(txt.join(' · ')), ' sum-alert' + (alertas ? '' : ' aviso')));
    }
    if(none === total){
      main.textContent = 'Fechas de actualización sin configurar';
      partes.push('Los informes siguen disponibles');
    } else {
      if(!yaConto && !reduce.matches && ok > 0){
        yaConto = true; anilloListo = false;
        main.innerHTML = '<span data-count>0</span> de ' + total + ' informes al día';
        var el = main.querySelector('[data-count]'), t0 = null, dur = 600;
        var ringBar = document.getElementById('ring-bar');
        ringBar.style.transition = 'none'; ringBar.setAttribute('stroke-dashoffset', '113.1');
        var objetivo = ok, totalR = total;
        window.INTRO_LISTA.then(function(){ setTimeout(function(){
          ringBar.style.transition = ''; anilloListo = true;
          document.getElementById('summary').classList.toggle('is-complete', objetivo === totalR);
          ringBar.setAttribute('stroke-dashoffset', (113.1 - 113.1 * (objetivo / totalR)).toFixed(1));
          requestAnimationFrame(paso);
        }, 250); });
        var paso = function(t){
          if(!t0) t0 = t;
          var k = Math.min(1, (t - t0) / dur);
          el.textContent = Math.round(ok * (1 - Math.pow(1 - k, 3)));
          if(k < 1) requestAnimationFrame(paso);
        };

      } else {
        main.textContent = ok + ' de ' + total + ' informes al día';
      }
      if(warn) partes.push(boton('warn', warn + ' por actualizar'));
      if(none) partes.push(boton('none', none + ' sin fecha'));
    }
    if(filtro) partes.push('<button type="button" class="sum-clear" data-clear>Ver todos</button>');
    sub.innerHTML = partes.join(' · ');
    sub.hidden = partes.length === 0;
    aplicar();
    var c = 113.1;
    if(anilloListo){
      document.getElementById('ring-bar').setAttribute('stroke-dashoffset', (c - c * (ok / total)).toFixed(1));
      document.getElementById('summary').classList.toggle('is-complete', ok === total);
    }
  }

  Promise.all(DATA.informes.map(function(inf){
    return leer(inf).then(function(st){ estado[inf.id] = st; });
  })).then(pintar);

  /* tiempos relativos siempre al día */
  setInterval(function(){
    pintarHoy();
    if(Object.keys(estado).length) pintar();
  }, 60000);

  /* ---------- Tema claro / oscuro ---------- */
  var OPTS = ['auto', 'light', 'dark'];
  var optBtns = Array.prototype.slice.call(themeBtn.querySelectorAll('[data-opt]'));
  function prefActual(){
    try{ var t = localStorage.getItem('incomelec-theme'); return OPTS.indexOf(t) > -1 ? t : 'auto'; }catch(e){ return 'auto'; }
  }
  function syncTheme(p){
    optBtns.forEach(function(b){
      var on = b.dataset.opt === p;
      b.setAttribute('aria-checked', on);
      b.tabIndex = on ? 0 : -1;
    });
    themeBtn.style.setProperty('--seg-i', OPTS.indexOf(p));
  }
  function setTheme(p){
    var apply = function(){
      if(p === 'auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', p);
      syncTheme(p);
    };
    if(document.startViewTransition && !reduce.matches) document.startViewTransition(apply); else apply();
    try{ localStorage.setItem('incomelec-theme', p); }catch(e){}
  }
  optBtns.forEach(function(b){ b.addEventListener('click', function(){ setTheme(b.dataset.opt); }); });
  themeBtn.addEventListener('keydown', function(e){
    if(e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    e.preventDefault();
    var i = OPTS.indexOf(prefActual()) + (e.key === 'ArrowRight' ? 1 : -1);
    var p = OPTS[(i + OPTS.length) % OPTS.length];
    setTheme(p); themeBtn.querySelector('[data-opt="' + p + '"]').focus();
  });
  syncTheme(prefActual());

  /* ---------- Elevación al pasar el cursor ---------- */
  function bindTilt(card){
    card.addEventListener('pointerenter', function(){ card.classList.add('is-hot'); });
    card.addEventListener('pointerleave', function(){ card.classList.remove('is-hot', 'is-press'); });
    card.addEventListener('pointerdown', function(){ card.classList.add('is-press'); });
    card.addEventListener('pointerup', function(){ card.classList.remove('is-press'); });
  }

  /* ---------- Buscador ---------- */
  function cards(){ return Array.prototype.slice.call(grid.querySelectorAll('.card')); }
  function visible(){ return cards().filter(function(c){ return !c.hidden; }); }
  function norm(s){ return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim(); }

  var NOMBRES_FILTRO = { alerta:'con alerta', warn:'por actualizar', none:'sin fecha' };
  var NOMBRES_FREC = { diario:'diarios', semanal:'semanales', mensual:'mensuales', demanda:'según necesidad', requerimiento:'de requerimientos', guia:'de guía' };

  /* ---------- Filtros de frecuencia ---------- */
  var frecuencia = 'todos';
  var CHIPS = DATA.filtros || [ { f:'todos', txt:'Todos' } ];
  var chipsEl = document.getElementById('chips');
  function pintarChips(){
    chipsEl.innerHTML = CHIPS.map(function(c){
      var n = c.f === 'todos' ? DATA.informes.length : DATA.informes.filter(function(i){ return i.tipo === c.f; }).length;
      if(!n) return '';
      return '<button type="button" class="chip" data-frec="' + c.f + '" aria-pressed="' + (frecuencia === c.f) + '">' + c.txt + ' <b>' + n + '</b></button>';
    }).join('');
  }
  chipsEl.addEventListener('click', function(e){
    var b = e.target.closest('[data-frec]');
    if(!b) return;
    frecuencia = b.dataset.frec;
    pintarChips();
    aplicar();
    var f = chipsEl.querySelector('[data-frec="' + frecuencia + '"]'); if(f) f.focus();
  });
  pintarChips();
  function aplicar(){
    var term = norm(q.value);
    var cambios = [], quedan = 0;
    cards().forEach(function(c){
      var porTexto = term === '' || norm(c.dataset.search).indexOf(term) > -1;
      var porFiltro = !filtro || (filtro === 'alerta' ? c.dataset.alerta === '1' : c.dataset.estado === filtro);
      porFiltro = porFiltro && (frecuencia === 'todos' || c.dataset.tipo === frecuencia);
      var ocultar = !(porTexto && porFiltro);
      if(c.hidden !== ocultar) cambios.push([c, ocultar]);
      if(!ocultar) quedan++;
    });
    var hacer = function(){
      cambios.forEach(function(x){ x[0].hidden = x[1]; });
      /* con pocas tarjetas, la cuadrícula se reorganiza y las tarjetas crecen para ocupar el espacio */
      grid.dataset.n = quedan;
      grid.classList.toggle('is-big', quedan > 0 && quedan <= 3);
    };
    /* las tarjetas se reacomodan con suavidad solo cuando algo cambia de verdad */
    if(cambios.length && document.startViewTransition && !reduce.matches) document.startViewTransition(hacer);
    else hacer();
    actualizarEstadoBusqueda(term, quedan);
  }
  function actualizarEstadoBusqueda(term, n){
    empty.hidden = n !== 0;
    if(n === 0) empty.textContent = term ? 'Ningún informe coincide con «' + q.value.trim() + '».'
      : 'No hay informes ' + [frecuencia !== 'todos' ? NOMBRES_FREC[frecuencia] : '', filtro ? NOMBRES_FILTRO[filtro] : ''].filter(Boolean).join(' ') + '.';
    status.textContent = (!term && !filtro && frecuencia === 'todos') ? '' : n === 0 ? 'Sin resultados' : n === 1 ? '1 informe. Enter para abrir.' : n + ' informes';
  }
  q.addEventListener('input', aplicar);

  /* resumen como filtro: clic para ver solo esos informes, otro clic o "Ver todos" para volver */
  document.getElementById('sum-sub').addEventListener('click', function(e){
    var b = e.target.closest('[data-f], [data-clear]');
    if(!b) return;
    filtro = b.hasAttribute('data-clear') || filtro === b.dataset.f ? null : b.dataset.f;
    pintar();
    var foco = document.querySelector('#sum-sub [data-f="' + filtro + '"]') || document.querySelector('#sum-sub [data-f]');
    if(foco) foco.focus();
  });
  q.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ var v = visible(); if(v.length){ e.preventDefault(); location.href = v[0].getAttribute('href'); } }
    else if(e.key === 'Escape'){ q.value = ''; aplicar(); q.blur(); }
    else if(e.key === 'ArrowDown'){ var w = visible(); if(w.length){ e.preventDefault(); w[0].focus(); } }
  });

  /* ---------- Teclado global ---------- */
  document.addEventListener('keydown', function(e){
    var tag = (document.activeElement && document.activeElement.tagName) || '';
    if(e.key === '/' && tag !== 'INPUT' && tag !== 'TEXTAREA'){ e.preventDefault(); q.focus(); q.select(); return; }
    var el = document.activeElement;
    if(el && el.classList && el.classList.contains('card')){
      var v = visible(), i = v.indexOf(el);
      if(e.key === 'ArrowRight' || e.key === 'ArrowDown'){ e.preventDefault(); v[(i + 1) % v.length].focus(); }
      if(e.key === 'ArrowLeft' || e.key === 'ArrowUp'){ e.preventDefault(); v[(i - 1 + v.length) % v.length].focus(); }
      if(e.key === 'Escape'){ el.blur(); }
    }
  });
})();
</script>
</body>
