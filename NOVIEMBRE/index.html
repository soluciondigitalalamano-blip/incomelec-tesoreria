<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noviembre | Panel Diario | INCOMELEC</title>
<meta name="description" content="Panel Diario de tesorería INCOMELEC — selección de semana.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,500;0,600;0,700;0,800;1,700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#146C43;
    --green-deep:#0B4A2E;
    --green-bright:#1C8A50;
    --white:#FFFFFF;
    --ink:#123526;
    --muted:#7E8E86;
    --badge:#E6F1E9;
  }

  *{box-sizing:border-box;}

  html,body{ margin:0; padding:0; min-height:100%; }

  body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:64px 20px;
    font-family:'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color:var(--white);
    background-color:var(--green);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(255,255,255,0.10) 1px, transparent 0),
      linear-gradient(165deg, var(--green) 0%, var(--green-deep) 100%);
    background-size:28px 28px, 100% 100%;
    background-attachment:fixed, fixed;
  }

  .back-link{
    position:fixed;
    top:24px;
    left:24px;
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    font-weight:600;
    letter-spacing:0.08em;
    color:rgba(255,255,255,0.85);
    text-decoration:none;
    padding:8px 12px;
    border-radius:8px;
    transition:background-color 0.2s ease;
  }
  .back-link:hover{ background:rgba(255,255,255,0.12); }
  .back-link svg{ width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

  /* ---------- Intro / logo ---------- */

  .intro{
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-bottom:44px;
  }

  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    font-weight:600;
    letter-spacing:0.5em;
    color:rgba(255,255,255,0.85);
    white-space:nowrap;
    overflow:hidden;
    border-right:2px solid rgba(255,255,255,0.85);
    width:0;
    margin:0 0 18px;
    padding-right:4px;
    animation:type 1s steps(9,end) 0.2s forwards, caret 0.6s step-end 6 1.2s forwards;
  }

  .logo-mark{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:11px 24px;
    border:2px solid var(--green);
    border-radius:10px;
    background:var(--white);
    opacity:0;
    transform:scale(0.88);
    animation:reveal 0.55s ease-out 1.15s forwards;
  }

  .logo-mark span{
    font-family:'Poppins', sans-serif;
    font-style:italic;
    font-weight:700;
    font-size:21px;
    letter-spacing:0.01em;
    color:var(--green);
  }

  .underline{
    width:0;
    height:2px;
    background:rgba(255,255,255,0.55);
    margin-top:16px;
    animation:draw 0.5s ease-out 1.7s forwards;
  }

  @keyframes type{ from{ width:0; } to{ width:10.3em; } }
  @keyframes caret{ 50%{ border-color:transparent; } }
  @keyframes reveal{ to{ opacity:1; transform:scale(1); } }
  @keyframes draw{ to{ width:64px; } }

  /* ---------- Links (3D buttons) ---------- */

  .links{
    width:100%;
    max-width:440px;
    display:flex;
    flex-direction:column;
    gap:16px;
    perspective:1400px;
    opacity:0;
    transform:translateY(14px);
    animation:links-in 0.6s ease-out 1.95s forwards;
  }

  @keyframes links-in{ to{ opacity:1; transform:translateY(0); } }

  .btn{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:20px 22px;
    background:var(--white);
    color:var(--ink);
    border-radius:16px;
    box-shadow:0 10px 22px -8px rgba(6,30,18,0.35);
    transform-style:preserve-3d;
    transform-origin:bottom center;
    transition:transform 0.35s cubic-bezier(.2,.8,.2,1), box-shadow 0.35s ease, background-color 0.25s ease, color 0.25s ease;
  }

  .btn .label{
    font-family:'Poppins', sans-serif;
    font-weight:600;
    font-size:16.5px;
    letter-spacing:0.01em;
    transition:font-weight 0.2s ease;
  }

  .icon{
    flex-shrink:0;
    width:38px;
    height:38px;
    border-radius:11px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--badge);
    transition:background-color 0.25s ease;
  }

  .icon svg{
    width:17px;
    height:17px;
    stroke:var(--green);
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
    transition:stroke 0.25s ease;
  }

  @media (hover:hover){
    .btn:hover{
      background:var(--green-bright);
      color:var(--white);
      transform:translateY(-8px) rotateX(9deg) scale(1.02);
      box-shadow:0 30px 44px -14px rgba(4,26,15,0.55);
    }
    .btn:hover .label{ font-weight:700; }
    .btn:hover .icon{ background:var(--white); }
    .btn:hover .icon svg{ stroke:var(--green-bright); }
  }

  .btn:active{
    background:var(--green-bright);
    color:var(--white);
  }
  .btn:active .icon{ background:var(--white); }
  .btn:active .icon svg{ stroke:var(--green-bright); }

  .btn:focus-visible{
    outline:2.5px solid rgba(255,255,255,0.9);
    outline-offset:3px;
  }

  @media (prefers-reduced-motion: reduce){
    .eyebrow{ animation:none; width:10.3em; border-right-color:transparent; }
    .logo-mark{ animation:none; opacity:1; transform:none; }
    .underline{ animation:none; width:64px; }
    .links{ animation:none; opacity:1; transform:none; }
    .btn, .btn .label, .icon, .icon svg{ transition:none; }
    .btn:hover{ transform:none; }
  }

  @media (max-width:480px){
    body{ padding:48px 16px; }
    .btn{ padding:18px 18px; }
    .btn .label{ font-size:15.5px; }
    .back-link{ top:16px; left:16px; }
  }
</style>
</head>
<body>

  <a class="back-link" href="../">
    <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    PORTAL
  </a>

  <div class="intro">
    <p class="eyebrow">NOVIEMBRE</p>
    <div class="logo-mark"><span>INCOMELEC</span></div>
    <div class="underline"></div>
  </div>

  <nav class="links">
    <a class="btn" href="./PRIMERA SEMANA/">
      <span class="label">Primera Semana</span>
      <span class="icon"><svg viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/></svg></span>
    </a>
    <a class="btn" href="./SEGUNDA SEMANA/">
      <span class="label">Segunda Semana</span>
      <span class="icon"><svg viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/></svg></span>
    </a>
    <a class="btn" href="./TERCERA SEMANA/">
      <span class="label">Tercera Semana</span>
      <span class="icon"><svg viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/></svg></span>
    </a>
    <a class="btn" href="./CUARTA SEMANA/">
      <span class="label">Cuarta Semana</span>
      <span class="icon"><svg viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/></svg></span>
    </a>
  </nav>

</body>
</html>
